  <script>/* Year 11 Preliminary Student Report Studio — no external services. */
(() => {
'use strict';
const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const STORE_KEY = 'bzgfls-year11-preliminary-report-studio-v1';
const GRADES = ['A','B','C','D','E'];
const RATING = {Consistently:4,Often:3,Occasionally:2,Rarely:1};
const DOTS = {4:'●●●●',3:'●●●○',2:'●●○○',1:'●○○○'};
const PROFILE_LABELS = [
  'Behaviour: is co-operative and polite to teachers and students.',
  'Effort: shows application to set tasks.',
  'Participation: is conscientious and motivated during class.',
  'Punctuality: arrives to class prepared and on time.'
];
const app = document.getElementById('app');
const stage = document.getElementById('report-stage');
const modalRoot = document.getElementById('modal-root');
const toastEl = document.getElementById('toast');
let toastTimer = null;
const ui = {view:'overview',adminTab:'settings',subjectId:null,editStudentId:null,reportStudentId:null,search:'',unsaved:false,storageAvailable:true};
function makeId(prefix='id'){return prefix+'_'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));}
function initialState(){return {version:1,schoolEn:SEED.schoolEn,schoolCn:SEED.schoolCn,academicYear:String(SEED.defaultYear),period:'Academic Year '+SEED.defaultYear,issueDate:'',staff:{classTeacher:'',hscCoordinator:'',deputyPrincipal:''},subjects:SEED.subjects.map(s=>({id:'sub_'+s.code.toLowerCase().replace(/[^a-z0-9]/g,''),code:s.code,name:s.name,units:s.units,teachers:'',criteria:[...s.criteria]})),students:[],reports:{},summaries:{}};}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);return raw?validateState(JSON.parse(raw)):initialState();}catch(err){ui.storageAvailable=false;console.warn('Local storage unavailable or invalid:',err);return initialState();}}
let data=loadState();
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));ui.storageAvailable=true;return true;}catch(err){ui.storageAvailable=false;toast('Changes cannot be saved in this browser. Export a JSON backup before leaving.','error');console.error(err);return false;}}
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){if(!iso)return 'Date not set';let [y,m,d]=String(iso).split('-').map(Number);if(!y||!m||!d)return escapeHTML(iso);return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date(y,m-1,d,12));}
function label(st){return st?`${st.pinyin}${st.english?' ('+st.english+')':''}`:'';}
function unitsText(n){const v=Number(n)||0;return `${v} ${v===1?'unit':'units'}`;}
function sortedStudents(){return [...data.students].sort((a,b)=>a.pinyin.localeCompare(b.pinyin,'en',{sensitivity:'base'}));}
function enrolled(st){return data.subjects.filter(s=>(st.subjectIds||[]).includes(s.id));}
function roster(subId){return sortedStudents().filter(st=>(st.subjectIds||[]).includes(subId));}
function getReport(studentId,subId){const entry=data.reports[studentId]?.[subId]||{};return {criteriaGrades:Array.isArray(entry.criteriaGrades)?entry.criteriaGrades:[],overallGrade:entry.overallGrade||'',profile:Array.isArray(entry.profile)?entry.profile:[],comment:entry.comment||''};}
function completeReport(st,sub){const r=getReport(st.id,sub.id);return GRADES.includes(r.overallGrade)&&sub.criteria.length>0&&sub.criteria.every((_,i)=>GRADES.includes(r.criteriaGrades[i]))&&r.profile.length>=4&&r.profile.slice(0,4).every(x=>RATING[x])&&r.comment.trim().length>0;}
function cohort(subId){const list=roster(subId),counts={A:0,B:0,C:0,D:0,E:0};for(const st of list){const grade=getReport(st.id,subId).overallGrade;if(GRADES.includes(grade))counts[grade]++;}return {total:list.length,graded:Object.values(counts).reduce((a,b)=>a+b,0),counts};}
function allEntries(){return data.students.reduce((sum,st)=>sum+enrolled(st).length,0);}
function completedEntries(){return data.students.reduce((sum,st)=>sum+enrolled(st).filter(s=>completeReport(st,s)).length,0);}
function profileTotal(rep){return rep.profile.slice(0,4).reduce((sum,r)=>sum+(RATING[r]||0),0);}
function issueList(st){const problems=[];if(!data.schoolEn.trim())problems.push('School name is missing.');if(!data.academicYear.trim())problems.push('Academic year is missing.');if(!data.issueDate)problems.push('Date of issue is not set.');if(!(st.classTeacher||data.staff.classTeacher).trim())problems.push('Class Teacher name is missing.');if(!data.staff.hscCoordinator.trim())problems.push('HSC Coordinator name is missing.');if(!data.staff.deputyPrincipal.trim())problems.push('Deputy Principal name is missing.');const subs=enrolled(st);if(!subs.length)problems.push('No subjects have been assigned to this student.');for(const s of subs){if(!s.teachers.trim())problems.push(s.name+': teacher name is missing.');if(!s.criteria.length)problems.push(s.name+': no learning criteria configured.');if(!completeReport(st,s))problems.push(s.name+': grade, criteria, profile or comment is incomplete.');const co=cohort(s.id);if(co.graded<co.total)problems.push(s.name+`: only ${co.graded} of ${co.total} overall cohort grades entered (distribution provisional).`);}return [...new Set(problems)];}
function toast(text,type='ok'){toastEl.textContent=text;toastEl.className='toast show'+(type==='error'?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),4400);}
function navButton(view,symbol,text){return `<button class="nav-btn ${ui.view===view?'active':''}" data-action="view" data-view="${view}" aria-current="${ui.view===view?'page':'false'}"><span class="ico">${symbol}</span>${text}</button>`;}
function render(){document.body.classList.remove('preview-mode');const title={overview:'Overview',admin:'Administration',subjects:'Subject entry',reports:'Student reports',help:'Help & publishing'}[ui.view]||'Overview';app.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="side-brand"><img src="${SEED.assets.emblem}" alt="School emblem"><div><strong>Student Report<br>Studio</strong><span>Year 11 · Preliminary</span></div></div><div class="side-section">Workspace</div><nav class="nav-list" aria-label="Main navigation">${navButton('overview','▦','Overview')}${navButton('subjects','▤','Subject entry')}${navButton('reports','▧','Generate reports')}${navButton('admin','⚙','Admin')}${navButton('help','?','Help & setup')}</nav><div class="sidebar-footer"><strong>Local-first workspace</strong>Student data stays on this device. Export JSON backups and exchange subject files privately. GitHub Pages does not sync records.</div></aside><div class="main-wrap"><header class="topbar"><div class="topbar-title">${escapeHTML(data.schoolEn)} <span style="color:#9ca9bb;font-weight:500">/</span> Report Studio</div><div class="topbar-meta"><span class="pill ${ui.storageAvailable?'':'warning'}">${ui.storageAvailable?'Saved in this browser':'Storage unavailable'}</span><span class="pill warning">${escapeHTML(data.academicYear)} · Stage 6</span></div></header><main class="main" id="main">${ui.view==='overview'?renderOverview():ui.view==='admin'?renderAdmin():ui.view==='subjects'?renderSubjects():ui.view==='reports'?renderReports():renderHelp()}</main></div></div>`;}
function renderOverview(){const total=allEntries(),done=completedEntries(),pct=total?Math.round(done/total*100):0;return `<div class="page-heading"><div><p class="eyebrow">Academic Year ${escapeHTML(data.academicYear)}</p><h1>Report dashboard</h1><p class="lead">One workspace for enrolments, subject reporting and parent-ready Year 11 Preliminary reports.</p></div><div class="actions"><button class="btn btn-secondary" data-action="export-all">Export backup</button><button class="btn btn-primary" data-action="view" data-view="reports">Generate PDF ↗</button></div></div>${!ui.storageAvailable?'<div class="notice red" style="margin-bottom:18px"><strong>Storage is unavailable in this preview.</strong> Your edits may not survive a reload. Open the HTML normally in a browser or the live preview, and export JSON regularly.</div>':''}<div class="stats"><div class="stat-card"><div class="stat-label">Students</div><div class="stat-value">${data.students.length}</div><div class="stat-hint">Names managed by admin</div></div><div class="stat-card gold"><div class="stat-label">Subjects</div><div class="stat-value">${data.subjects.length}</div><div class="stat-hint">${data.subjects.reduce((a,s)=>a+(Number(s.units)||0),0)} default units on offer</div></div><div class="stat-card"><div class="stat-label">Completed entries</div><div class="stat-value">${done}<span style="font:14px Inter,Arial,sans-serif;color:#8795a9"> / ${total}</span></div><div class="stat-hint">Student–subject combinations</div></div><div class="stat-card gold"><div class="stat-label">Progress</div><div class="stat-value">${pct}%</div><div class="progress"><span style="width:${pct}%"></span></div></div></div><div class="two-col"><section class="section-card"><div class="card-title"><div><h2>Students</h2><p>Open a record or preview its report.</p></div><button class="btn btn-small btn-secondary" data-action="admin-tab" data-tab="students">Manage students</button></div>${data.students.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Subjects</th><th>Entries complete</th><th>Report</th></tr></thead><tbody>${sortedStudents().slice(0,8).map(st=>{let subjects=enrolled(st),done=subjects.filter(s=>completeReport(st,s)).length;return `<tr><td>${escapeHTML(label(st))}</td><td>${subjects.length}</td><td><span class="soft-tag ${done===subjects.length&&done?'green':'gold'}">${done}/${subjects.length}</span></td><td><button class="btn btn-small btn-secondary" data-action="preview" data-id="${escapeHTML(st.id)}">Preview</button></td></tr>`}).join('')}</tbody></table></div>${data.students.length>8?`<p class="footer-note">Showing 8 of ${data.students.length} students. Open Admin for the full roster.</p>`:''}`:'<div class="empty"><span class="symbol">◇</span>No students yet. Add the Year 11 roster in Admin to get started.</div>'}</section><section class="section-card"><div class="card-title"><div><h2>How this works</h2><p>From setup to PDF.</p></div></div><ol class="step-list"><li>Admin adds student names, enrolments, teachers and report signatories.</li><li>Teachers select their subject and enter grades, learner profile and comments.</li><li>Teachers export a subject JSON package; admin imports and merges the packages.</li><li>Admin previews a student report, then uses Generate PDF → Save as PDF.</li></ol><div class="notice" style="margin-top:14px"><strong>Privacy reminder:</strong> the page can be public on GitHub Pages, but report data remains in each browser. JSON exports contain sensitive student information; share them only through approved school channels.</div></section></div>`;}
function renderAdmin(){const tabs=[['settings','School & staff'],['students','Students'],['subjects','Subjects'],['data','Data transfer']];return `<div class="page-heading"><div><p class="eyebrow">Administration</p><h1>Set up the reporting year</h1><p class="lead">Manage the roster, courses, teachers and signatories before teachers enter reports.</p></div></div><div class="notice blue" style="margin-bottom:16px"><strong>Admin is a workflow area, not secure access control.</strong> This one-file browser-only app has no account sign-in. Do not use shared devices for confidential data.</div><div class="subnav" role="tablist" aria-label="Admin sections">${tabs.map(([id,text])=>`<button role="tab" aria-selected="${ui.adminTab===id}" class="${ui.adminTab===id?'active':''}" data-action="admin-tab" data-tab="${id}">${text}</button>`).join('')}</div>${ui.adminTab==='settings'?renderAdminSettings():ui.adminTab==='students'?renderAdminStudents():ui.adminTab==='subjects'?renderAdminSubjects():renderAdminData()}`;}
function renderAdminSettings(){return `<form id="settings-form"><div class="section-card"><div class="card-title"><div><h2>School and report settings</h2><p>The supplied logo and cover wordmark are fixed artwork; school text settings also appear on the report.</p></div></div><div class="field-grid"><div class="field"><label for="school-en">School name (English)</label><input id="school-en" name="schoolEn" value="${escapeHTML(data.schoolEn)}" required></div><div class="field"><label for="school-cn">School name (Chinese)</label><input id="school-cn" name="schoolCn" value="${escapeHTML(data.schoolCn)}"></div><div class="field"><label for="academic-year">Academic year</label><input id="academic-year" name="academicYear" type="number" min="2020" max="2100" value="${escapeHTML(data.academicYear)}" required></div><div class="field"><label for="period">Reporting period</label><input id="period" name="period" value="${escapeHTML(data.period)}" placeholder="Academic Year 2027" required></div><div class="field"><label for="issue-date">Date of issue</label><input id="issue-date" name="issueDate" type="date" value="${escapeHTML(data.issueDate)}"><small>Required before a report is marked final.</small></div></div></div><div class="section-card"><div class="card-title"><div><h2>Report signatories</h2><p>Names printed beneath the certification lines on the last page.</p></div></div><div class="field-grid three"><div class="field"><label for="staff-class">Default Class Teacher</label><input id="staff-class" name="classTeacher" value="${escapeHTML(data.staff.classTeacher)}" placeholder="Enter Class Teacher name"></div><div class="field"><label for="staff-hsc">HSC Coordinator</label><input id="staff-hsc" name="hscCoordinator" value="${escapeHTML(data.staff.hscCoordinator)}" placeholder="Enter HSC Coordinator name"></div><div class="field"><label for="staff-deputy">Deputy Principal</label><input id="staff-deputy" name="deputyPrincipal" value="${escapeHTML(data.staff.deputyPrincipal)}" placeholder="Enter Deputy Principal name"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Save settings</button></div></div></form>`;}
function renderAdminStudents(){return `<div class="section-card"><div class="card-title"><div><h2>Student roster</h2><p>Add Pinyin and English names, subject enrolments and optional class-teacher override.</p></div><button class="btn btn-primary" data-action="student-modal">+ Add student</button></div>${data.students.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Courses</th><th>Class Teacher</th><th>Actions</th></tr></thead><tbody>${sortedStudents().map(st=>`<tr><td>${escapeHTML(label(st))}</td><td>${enrolled(st).length} subject${enrolled(st).length===1?'':'s'}</td><td>${escapeHTML(st.classTeacher||data.staff.classTeacher||'Not set')}</td><td><div class="actions"><button class="btn btn-small btn-secondary" data-action="student-modal" data-id="${escapeHTML(st.id)}">Edit</button><button class="btn btn-small btn-danger" data-action="delete-student" data-id="${escapeHTML(st.id)}">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span class="symbol">♧</span>No students yet. Add the first student and select their courses.</div>'}</div>`;}
function renderAdminSubjects(){return `<div class="section-card"><div class="card-title"><div><h2>Subjects and criteria</h2><p>Course order controls both parts of the printed report.</p></div><button class="btn btn-primary" data-action="subject-modal">+ Add subject</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Order</th><th>Subject</th><th>Teacher(s)</th><th>Units</th><th>Criteria</th><th>Actions</th></tr></thead><tbody>${data.subjects.map((s,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${escapeHTML(s.name)} <span class="soft-tag">${escapeHTML(s.code)}</span></td><td>${escapeHTML(s.teachers||'Not set')}</td><td>${escapeHTML(s.units)}</td><td>${s.criteria.length}</td><td><div class="actions"><button class="btn btn-small btn-secondary icon-btn" data-action="move-subject" data-id="${escapeHTML(s.id)}" data-dir="-1" title="Move up" ${i===0?'disabled':''}>↑</button><button class="btn btn-small btn-secondary icon-btn" data-action="move-subject" data-id="${escapeHTML(s.id)}" data-dir="1" title="Move down" ${i===data.subjects.length-1?'disabled':''}>↓</button><button class="btn btn-small btn-secondary" data-action="export-starter" data-id="${escapeHTML(s.id)}" title="Share only this subject’s roster and criteria">Teacher starter</button>
<button class="btn btn-small btn-secondary" data-action="subject-modal" data-id="${escapeHTML(s.id)}">Edit</button><button class="btn btn-small btn-danger" data-action="delete-subject" data-id="${escapeHTML(s.id)}">Remove</button></div></td></tr>`).join('')}</tbody></table></div></div>`;}
function renderAdminData(){return `<div class="two-col"><div class="section-card"><h2>Export and import</h2><p class="lead" style="margin-bottom:19px">JSON transfers are how teachers work on separate browsers in the local-only version.</p><div class="details-list"><div><span>Full workspace backup (private)</span><button class="btn btn-small btn-secondary" data-action="export-all">Export all JSON</button></div><div><span>Import backup, teacher starter or subject entries</span><button class="btn btn-small btn-secondary" data-action="import-json">Import JSON</button></div><div><span>Delete this browser's stored records</span><button class="btn btn-small btn-danger" data-action="reset-all">Reset local data</button></div></div><input type="file" id="json-import" accept=".json,application/json" hidden><div class="notice red" style="margin-top:17px"><strong>Sensitive data:</strong> backups include student names and results. Do not add them to a public GitHub repository, send them in unapproved email or store them on a shared computer.</div></div><div class="section-card"><h2>Teacher handoff</h2><ol class="step-list"><li>Admin completes setup, then exports a separate <strong>Teacher starter</strong> from the Subjects tab for each course. Each starter contains only that subject’s roster and criteria, not other students’ results.</li><li>Each teacher imports their own starter in Admin → Data transfer, then enters only their subject’s reports.</li><li>Each teacher uses <strong>Export subject entries</strong> in their subject view.</li><li>Admin imports each subject package to merge teacher entries into the master copy.</li><li>Admin exports another private full backup after all packages are merged.</li></ol><p class="footer-note">A subject package matches stable student and subject IDs from the admin’s starter file. If the roster changes, resend a fresh starter to teachers. Never share the admin’s full backup as a teacher starter.</p></div></div>`;}
function renderSubjects(){if(ui.editStudentId&&ui.subjectId)return renderEditor();if(ui.subjectId)return renderRoster();return `<div class="page-heading"><div><p class="eyebrow">Subject entry</p><h1>Choose a course</h1><p class="lead">Open your subject roster to record learning-criteria grades, the overall grade, four learner-profile ratings and a teacher comment.</p></div></div><div class="subject-grid">${data.subjects.map(s=>{const students=roster(s.id),done=students.filter(st=>completeReport(st,s)).length,pct=students.length?Math.round(done/students.length*100):0;return `<article class="subject-card"><div class="subject-card-head"><h3>${escapeHTML(s.name)}</h3><span class="subject-code">${escapeHTML(s.code)}</span></div><div class="teacher">${escapeHTML(s.teachers||'Teacher not yet assigned by admin')} · ${unitsText(s.units)}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="foot"><small>${done}/${students.length} student reports complete</small><button class="btn btn-small btn-primary" data-action="open-subject" data-id="${escapeHTML(s.id)}">Enter reports →</button></div></article>`}).join('')}</div>${!data.students.length?'<div class="notice" style="margin-top:19px">Admin must add the student roster and enrolments before teacher entry can begin.</div>':''}`;}
function renderRoster(){const s=data.subjects.find(x=>x.id===ui.subjectId);if(!s){ui.subjectId=null;return renderSubjects();}const students=roster(s.id),c=cohort(s.id);return `<div class="crumb"><button data-action="back-subjects">Subject entry</button> / ${escapeHTML(s.name)}</div><div class="roster-header"><div><p class="eyebrow">${escapeHTML(s.code)} · ${unitsText(s.units)}</p><h1>${escapeHTML(s.name)}</h1><p class="lead">${escapeHTML(s.teachers||'Teacher not set')} · ${students.length} enrolled student${students.length===1?'':'s'} · ${c.graded}/${c.total} overall grades entered</p></div><button class="btn btn-secondary" data-action="export-subject" data-id="${escapeHTML(s.id)}">Export subject entries</button></div><div class="section-card"><div class="card-title"><div><h2>Student roster</h2><p>Use Edit report to enter and revise one student's record.</p></div><span class="soft-tag ${c.graded===c.total&&c.total?'green':'gold'}">${c.graded}/${c.total} graded</span></div>${students.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Overall grade</th><th>Entry</th><th></th></tr></thead><tbody>${students.map(st=>{const r=getReport(st.id,s.id),done=completeReport(st,s);return `<tr><td>${escapeHTML(label(st))}</td><td><span class="grade-badge ${r.overallGrade?'':'blank'}">${escapeHTML(r.overallGrade||'—')}</span></td><td><span class="soft-tag ${done?'green':'gold'}">${done?'Complete':'In progress'}</span></td><td><button class="btn btn-small btn-primary" data-action="edit-entry" data-id="${escapeHTML(st.id)}">Edit report</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No students are enrolled in this subject. Admin can assign them in the roster.</div>'}</div>`;}
function selectHTML(name,value,opts,placeholder='Select…'){return `<select name="${name}"><option value="">${placeholder}</option>${opts.map(opt=>`<option value="${escapeHTML(opt)}" ${value===opt?'selected':''}>${escapeHTML(opt)}</option>`).join('')}</select>`;}
function renderEditor(){const sub=data.subjects.find(x=>x.id===ui.subjectId),st=data.students.find(x=>x.id===ui.editStudentId);if(!sub||!st){ui.editStudentId=null;return renderRoster();}const r=getReport(st.id,sub.id),students=roster(sub.id),pos=students.findIndex(x=>x.id===st.id);return `<div class="crumb"><button data-action="back-subjects">Subject entry</button> / <button data-action="back-roster">${escapeHTML(sub.name)}</button> / ${escapeHTML(label(st))}</div><div class="editor-top"><div><p class="eyebrow">${escapeHTML(sub.code)} · Student ${pos+1} of ${students.length}</p><h1>${escapeHTML(label(st))}</h1><p class="lead">${escapeHTML(sub.name)} · ${escapeHTML(sub.teachers||'Teacher not assigned')}</p></div><span class="soft-tag ${completeReport(st,sub)?'green':'gold'}">${completeReport(st,sub)?'Complete':'In progress'}</span></div><form id="teacher-report-form" data-student="${escapeHTML(st.id)}" data-subject="${escapeHTML(sub.id)}"><div class="editor-grid"><div><section class="section-card"><div class="card-title"><div><h2>Learning criteria</h2><p>Choose an A–E achievement level for every criterion.</p></div></div>${sub.criteria.length?sub.criteria.map((text,i)=>`<div class="criterion-row"><span><strong style="color:var(--gold);margin-right:6px">${String(i+1).padStart(2,'0')}</strong>${escapeHTML(text)}</span>${selectHTML('crit_'+i,r.criteriaGrades[i]||'',GRADES,'—')}</div>`).join(''):'<div class="notice red">No learning criteria configured. Ask admin to add criteria for this subject.</div>'}</section><section class="section-card"><div class="card-title"><div><h2>Teacher comment</h2><p>Write the student's strengths, areas for development and next steps.</p></div></div><div class="field"><label for="comment-box">Comment for ${escapeHTML(st.english)}</label><textarea id="comment-box" name="comment" rows="12" maxlength="3000" placeholder="Write the student comment here…">${escapeHTML(r.comment)}</textarea><small>Blank lines create paragraphs. A line beginning <span class="code">##</span> becomes a small heading; a line beginning <span class="code">-</span> becomes a bullet. Maximum 3,000 characters; review the report preview before printing.</small></div></section></div><div><section class="section-card"><h2>Overall grade</h2><p class="lead" style="margin-bottom:12px">Awarded across the course; this is separate from the learner profile.</p><div class="field"><label for="overall-select">A–E grade</label><div id="overall-select">${selectHTML('overallGrade',r.overallGrade,GRADES)}</div></div><div class="divider"></div><h2>Learner profile</h2><p class="lead" style="margin-bottom:14px">Select a frequency rating for each area.</p>${PROFILE_LABELS.map((text,i)=>`<div class="profile-edit-row"><div>${escapeHTML(text.split(':')[0])}<div class="desc">${escapeHTML(text.split(':').slice(1).join(':').trim())}</div></div>${selectHTML('profile_'+i,r.profile[i]||'',Object.keys(RATING))}</div>`).join('')}</section><div class="notice blue">The A–E cohort distribution in the final report is calculated automatically from all enrolled students' overall grades. ${cohort(sub.id).graded}/${cohort(sub.id).total} are currently graded.</div></div></div><div class="sticky-actions"><div class="editor-status" id="editor-status">Changes are saved when you click Save.</div><div class="actions"><button type="button" class="btn btn-secondary" data-action="back-roster">Back to roster</button><button class="btn btn-primary" type="submit" name="saveMode" value="stay">Save entry</button>${pos<students.length-1?'<button class="btn btn-gold" type="submit" name="saveMode" value="next">Save & next →</button>':''}</div></div></form>`;}
function renderReports(){
 const selected=data.students.find(x=>x.id===ui.reportStudentId)||sortedStudents()[0];
 if(selected)ui.reportStudentId=selected.id;
 const issues=selected?issueList(selected):[];
 const selection=selected?`<div class="field" style="margin:14px 0 18px"><label for="report-student">Student</label><select id="report-student">${sortedStudents().map(st=>`<option value="${escapeHTML(st.id)}" ${selected.id===st.id?'selected':''}>${escapeHTML(label(st))}</option>`).join('')}</select></div><div class="details-list"><div><span>Subjects enrolled</span><span>${enrolled(selected).length}</span></div><div><span>Report entries complete</span><span>${enrolled(selected).filter(s=>completeReport(selected,s)).length}/${enrolled(selected).length}</span></div><div><span>Preliminary units</span><span>${enrolled(selected).reduce((a,s)=>a+Number(s.units||0),0)}</span></div><div><span>Overall readiness</span><span>${issues.length?'Draft / incomplete':'Ready to print'}</span></div></div><div class="form-actions"><button class="btn btn-secondary" data-action="preview" data-id="${escapeHTML(selected.id)}">Preview report</button><button class="btn btn-primary" data-action="generate-pdf" data-id="${escapeHTML(selected.id)}">Generate PDF ↗</button></div>`:'<div class="empty">Add a student in Admin before generating reports.</div>';
 const checklist=!selected?'<p class="lead">Select a student to check report readiness.</p>':issues.length?`<div class="notice" style="margin-top:14px"><strong>${issues.length} item${issues.length===1?'':'s'} need attention.</strong> You can preview or print a clearly marked draft, but the final report should be completed first.</div><ul style="font-size:12px;color:#526278;line-height:1.7;padding-left:20px">${issues.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<div class="notice blue" style="margin-top:14px"><strong>Ready.</strong> All required fields are complete and each subject’s cohort grade distribution is final.</div>';
 return `<div class="page-heading"><div><p class="eyebrow">PDF reports</p><h1>Generate a student report</h1><p class="lead">Preview the branded A4 layout, then choose Save as PDF in the browser print dialog.</p></div></div><div class="two-col"><section class="section-card"><h2>Select student</h2>${selection}</section><section class="section-card"><h2>Final-report checklist</h2>${checklist}<p class="footer-note">The print command uses A4 paper. In the print dialog choose <strong>Save as PDF</strong>, set margins to <strong>None</strong>, turn off browser headers and footers, and enable <strong>Background graphics</strong> so school colours print correctly.</p></section></div>${selected?`<div class="section-card"><div class="card-title"><div><h2>Optional profile summary</h2><p>Admin may tailor the strengths and development panels on this student's report. If left blank, a neutral data-based summary is used.</p></div></div>${renderSummaryForm(selected)}</div>`:''}`;
}
function renderSummaryForm(st){const x=data.summaries[st.id]||{};return `<form id="summary-form" data-id="${escapeHTML(st.id)}"><div class="field-grid"><div class="field full"><label for="summary-overview">Overview paragraph</label><textarea id="summary-overview" name="overview" rows="3" placeholder="Optional coordinator summary…">${escapeHTML(x.overview||'')}</textarea></div><div class="field"><label for="summary-strengths">Demonstrated strengths (one per line)</label><textarea id="summary-strengths" name="strengths" rows="5">${escapeHTML(x.strengths||'')}</textarea></div><div class="field"><label for="summary-development">Areas for development (one per line)</label><textarea id="summary-development" name="development" rows="5">${escapeHTML(x.development||'')}</textarea></div></div><div class="form-actions"><button class="btn btn-secondary" type="submit">Save summary</button></div></form>`;}
function renderHelp(){return `<div class="page-heading"><div><p class="eyebrow">Guide</p><h1>Use and publish this app</h1><p class="lead">A single HTML file: no build tools, external libraries or server-side code are required.</p></div></div><div class="help-grid"><section class="section-card"><h2>Launch on GitHub Pages</h2><ol><li>Create a GitHub repository (preferably for the app code only).</li><li>Upload this file as <span class="code">index.html</span> to the repository root.</li><li>In Settings → Pages, choose “Deploy from a branch,” then select the main branch and root folder.</li><li>Open the published URL over HTTPS and configure the report year in Admin.</li><li><strong>Never commit exported JSON files</strong>; they contain confidential student records.</li></ol><div class="notice blue">The GitHub page hosts the app code only. Report data is stored locally in each browser; teachers do not automatically see one another's work.</div></section><section class="section-card"><h2>PDF print settings</h2><ol><li>Select a student in Generate reports and choose Preview report.</li><li>Click Generate PDF / Print. In the browser dialog, set paper size to <strong>A4</strong> and destination to <strong>Save as PDF</strong>.</li><li>Set margins to <strong>None</strong> and disable browser headers/footers.</li><li>Enable <strong>Background graphics</strong> for the navy/gold tables and watermark.</li><li>Review the PDF before sending it to a parent or guardian.</li></ol><p class="footer-note">A browser print dialog is required; this file does not send reports to a server.</p></section><section class="section-card"><h2>Data protection</h2><p class="lead">Student information is sensitive. Local storage is not an authenticated database, and the Admin tab is not password-protected.</p><ul style="font-size:12px;color:#526278;line-height:1.7;padding-left:19px"><li>Use school-managed devices and approved private channels for JSON files.</li><li>Export backups frequently and retain them according to school policy.</li><li>Clear browser data only after safely exporting a backup.</li><li>For simultaneous multi-teacher editing and role-based permissions, deploy a secure cloud backend rather than relying on GitHub Pages alone.</li></ul></section><section class="section-card"><h2>Report content</h2><p class="lead">The template follows the Year 11 Preliminary sample: cover, Part One achievement data, Part Two teacher comments, course summary and an appendix with achievement and learner-profile descriptors.</p><div class="divider"></div><div class="details-list"><div><span>Default year</span><span>${escapeHTML(data.academicYear)}</span></div><div><span>Default subjects</span><span>${data.subjects.length} editable courses</span></div><div><span>Report format</span><span>A4 · print to PDF</span></div></div></section></div>`;}
/* ---------- A4 report rendering ---------- */
function levelName(g){return SEED.achievementLevels.find(x=>x[0]===g)?.[1]||'';}
function fromLines(str){return String(str||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);}
function naturalList(arr){if(!arr.length)return '';if(arr.length===1)return arr[0];return arr.slice(0,-1).join(', ')+' and '+arr.at(-1);}
function autoSummary(st,subs){const high=subs.filter(s=>['A','B'].includes(getReport(st.id,s.id).overallGrade)).map(s=>s.name),develop=subs.filter(s=>['D','E'].includes(getReport(st.id,s.id).overallGrade)).map(s=>s.name);const overview=high.length?`${st.english} has demonstrated strong academic achievement in ${naturalList(high)}. The subject reports below provide a course-by-course account of achievement and learning habits.`:`This report brings together ${st.english}'s Year 11 Preliminary achievement and learning profile across the subjects studied.`;const strengths=high.length?high.slice(0,3).map(x=>`Achievement in ${x}.`):['Review the subject-specific teacher comments to identify demonstrated strengths.'];const consistent=PROFILE_LABELS.map((x,i)=>({name:x.split(':')[0],count:subs.filter(s=>getReport(st.id,s.id).profile[i]==='Consistently').length})).filter(x=>x.count>=Math.max(1,Math.ceil(subs.length/2)));if(consistent.length)strengths.push(`Consistent ${consistent.map(x=>x.name.toLowerCase()).join(' and ')} across reported courses.`);const development=develop.length?develop.slice(0,3).map(x=>`Further consolidation in ${x}.`):['Continue to follow the next steps identified in the subject teacher comments.'];const lower=PROFILE_LABELS.map((x,i)=>({name:x.split(':')[0],count:subs.filter(s=>['Occasionally','Rarely'].includes(getReport(st.id,s.id).profile[i])).length})).filter(x=>x.count>0);if(lower.length)development.push(`Build greater consistency in ${lower.map(x=>x.name.toLowerCase()).join(' and ')}.`);return {overview,strengths,development};}
function reportSummary(st,subs){const auto=autoSummary(st,subs),manual=data.summaries[st.id]||{};return {overview:manual.overview?.trim()||auto.overview,strengths:fromLines(manual.strengths).length?fromLines(manual.strengths):auto.strengths,development:fromLines(manual.development).length?fromLines(manual.development):auto.development};}
function reportCover(st,subs,draft){const total=subs.reduce((n,s)=>n+Number(s.units||0),0);return `<div class="cover-brand"><img class="cover-emblem" src="${SEED.assets.emblem}" alt="School emblem"><img class="cover-name" src="${SEED.assets.schoolName}" alt="${escapeHTML(data.schoolEn)}"></div><div class="cover-top-rule"></div><div class="cover-title"><div class="kicker">Senior Secondary • Stage 6</div><div class="yearline">Year 11 - Preliminary</div><div class="mainline">Student Report</div></div><div class="cover-bottom-rule"></div><div class="cover-academic">Academic Year ${escapeHTML(data.academicYear)}</div><div class="cover-names"><div><div class="lab">Student Name (Pinyin)</div><div class="val">${escapeHTML(st.pinyin)}</div></div><div><div class="lab">English Name</div><div class="val">${escapeHTML(st.english)}</div></div></div><div class="cover-details"><div><div class="lab">Year & Stage</div><div class="val">Year 11 - Preliminary</div></div><div><div class="lab">Reporting Period</div><div class="val">${escapeHTML(data.period||'Academic Year '+data.academicYear)}</div></div><div><div class="lab">Date of Issue</div><div class="val">${escapeHTML(fmtDate(data.issueDate))}</div></div></div><div class="cover-courses"><div class="cover-courses-title">Courses Reported · Preliminary Unit Load</div><table><thead><tr><th style="width:15mm;text-align:center">No.</th><th>Subject</th><th style="width:26mm;text-align:center">Units</th></tr></thead><tbody>${subs.map((s,i)=>`<tr><td class="num">${String(i+1).padStart(2,'0')}</td><td>${escapeHTML(s.name)}</td><td class="units">${unitsText(s.units)}</td></tr>`).join('')}<tr class="total"><td colspan="2">Total Preliminary Units Earned</td><td>${unitsText(total)}</td></tr></tbody></table></div><div class="cover-note">This report presents a summary of ${escapeHTML(st.english)}'s academic achievement, learning profile and teacher comments for each course studied in the Year 11 Preliminary program. It should be read in conjunction with the assessment schedule and the school's reporting policy.</div><div class="cover-office">Senior Secondary Academic Office · ${escapeHTML(data.schoolEn)}</div><div class="cover-footer">This report is confidential and is intended for the student and their parent or guardian.</div>${draft?'<div class="draft-mark">DRAFT</div>':''}`;}
function partHead(label,title,text){return `<div class="part-head rpt-block"><div class="mini">${escapeHTML(label)}</div><h2>${escapeHTML(title)}</h2><div class="rule"></div><p>${escapeHTML(text)}</p></div>`;}
function subjectBand(s,index,grade){const staff=String(s.teachers||'Teacher not set');return `<div class="rpt-band"><div class="number">${String(index+1).padStart(2,'0')}</div><div class="subject-name"><strong>${escapeHTML(s.name)}</strong><small><b>Subject Teacher${staff.includes(' and ')?'s':''} ·</b> ${escapeHTML(staff)}</small></div>${grade?`<div class="band-grade">Overall Grade&nbsp; ${escapeHTML(grade||'—')}</div>`:''}</div>`;}
function rptAchievement(st,s,index){const r=getReport(st.id,s.id),co=cohort(s.id);return `<section class="rpt-block rpt-achievement">${subjectBand(s,index,false)}<table class="rpt-table rpt-criteria"><colgroup><col><col style="width:23.5mm"></colgroup><thead><tr><th>Learning Criteria</th><th>Achievement</th></tr></thead><tbody>${s.criteria.length?s.criteria.map((c,i)=>`<tr><td>${escapeHTML(c)}</td><td>${escapeHTML(r.criteriaGrades[i]||'—')}</td></tr>`).join(''):'<tr><td>Learning criteria not yet configured.</td><td>—</td></tr>'}</tbody></table><div class="rpt-cap">Overall Grade · Cohort Distribution (Number of Students / Cohort)</div><table class="rpt-table rpt-overall"><colgroup><col style="width:33mm">${GRADES.map(()=>'<col>').join('')}</colgroup><tr><td class="big">${escapeHTML(r.overallGrade||'—')}</td>${GRADES.map(g=>`<td class="${r.overallGrade===g?'selected':''}"><span>${g}</span>${co.counts[g]}/${co.total}</td>`).join('')}</tr></table><div class="rpt-cap">Learner Profile</div><table class="rpt-table rpt-profile"><colgroup><col><col style="width:54mm"></colgroup><tbody>${PROFILE_LABELS.map((x,i)=>`<tr><td>${escapeHTML(x)}</td><td>${escapeHTML(r.profile[i]||'Not set')}&nbsp;&nbsp; <span class="dots">${DOTS[RATING[r.profile[i]]]||'○○○○'}</span></td></tr>`).join('')}</tbody></table></section>`;}
function rptResultSummary(st,subs){return `<section class="rpt-block rpt-summary"><h3>Summary of Results</h3><div class="rpt-rule"></div><p class="rpt-intro">The table below summarises the overall grade awarded in each course, together with the distribution of overall grades across the cohort for that course.</p><table class="rpt-table rpt-results"><colgroup><col style="width:72mm"><col style="width:20mm">${GRADES.map(()=>'<col>').join('')}</colgroup><thead><tr><th style="text-align:left">Course</th><th>Overall<br>Grade</th>${GRADES.map(g=>`<th>${g}</th>`).join('')}</tr></thead><tbody>${subs.map((s,i)=>{const co=cohort(s.id),r=getReport(st.id,s.id);return `<tr><td><span class="name-no">${String(i+1).padStart(2,'0')}</span>${escapeHTML(s.name)}</td><td style="font:700 9.5pt Georgia,serif;color:var(--navy)">${escapeHTML(r.overallGrade||'—')}</td>${GRADES.map(g=>`<td class="${r.overallGrade===g?'selected':''}">${co.counts[g]}/${co.total}</td>`).join('')}</tr>`}).join('')}<tr class="footer-row"><td>Cohort of Record</td><td colspan="6">Counts show graded students / students enrolled in each course. ${subs.some(s=>cohort(s.id).graded<cohort(s.id).total)?'Draft: some overall grades are not yet entered.':''}</td></tr></tbody></table></section>`;}
function rptProfileSummary(st,subs){const x=reportSummary(st,subs);return `<section class="rpt-block rpt-profile-summary"><h3>Profile Summary</h3><div class="rpt-rule"></div><p>${escapeHTML(x.overview)}</p><div class="summary-panels"><div class="summary-panel"><h4>Demonstrated Strengths</h4><ul>${x.strengths.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div><div class="summary-panel"><h4>Areas for Development</h4><ul>${x.development.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div></div></section>`;}
function parseComment(text){const lines=String(text||'').replace(/\r/g,'').split('\n'),parts=[],para=[];function flush(){if(para.length){parts.push(`<p>${escapeHTML(para.join(' '))}</p>`);para.length=0;}}let inList=false;for(const raw of lines){const line=raw.trim();if(!line){flush();if(inList){parts.push('</ul>');inList=false;}continue;}if(/^#{1,3}\s+/.test(line)){flush();if(inList){parts.push('</ul>');inList=false;}parts.push(`<h4>${escapeHTML(line.replace(/^#{1,3}\s+/,''))}</h4>`);}else if(/^[-•]\s+/.test(line)){flush();if(!inList){parts.push('<ul>');inList=true;}parts.push(`<li>${escapeHTML(line.replace(/^[-•]\s+/,''))}</li>`);}else{if(inList){parts.push('</ul>');inList=false;}para.push(line);}}flush();if(inList)parts.push('</ul>');return parts.join('')||'<p>Teacher comment not yet entered.</p>';}
function rptTeacherComment(st,s,index){const r=getReport(st.id,s.id);return `<section class="rpt-block rpt-teacher">${subjectBand(s,index,r.overallGrade||'—')}<div class="rpt-comment">${parseComment(r.comment)}</div></section>`;}
function rptCourseSummary(st,subs){return `<section class="rpt-block rpt-course-summary"><h3>Course-by-Course Summary</h3><div class="rpt-rule"></div><p class="rpt-intro" style="font-style:normal">The matrix presents each course's overall grade alongside its separately reported learner profile. The two measures offer a concise reference for setting learning goals at the start of Year 12.</p><table class="rpt-table rpt-matrix"><colgroup>${[50,19,22,18,24,24,21].map(n=>`<col style="width:${n}mm">`).join('')}</colgroup><thead><tr><th style="text-align:left">Course</th><th>Overall<br>Grade</th><th>Behaviour</th><th>Effort</th><th>Participation</th><th>Punctuality</th><th>Profile<br>Total</th></tr></thead><tbody>${subs.map((s,i)=>{const r=getReport(st.id,s.id);return `<tr><td><span class="name-no">${String(i+1).padStart(2,'0')}</span>${escapeHTML(s.code==='EAL/D'?'English (EAL/D)':s.name)}</td><td style="font:700 9.4pt Georgia,serif;color:var(--navy)">${escapeHTML(r.overallGrade||'—')}</td>${[0,1,2,3].map(k=>`<td class="dots">${DOTS[RATING[r.profile[k]]]||'○○○○'}</td>`).join('')}<td style="font-weight:700;color:var(--navy-dark)">${r.profile.length===4&&r.profile.every(x=>RATING[x])?profileTotal(r):'—'}/16</td></tr>`}).join('')}<tr class="footer-row"><td colspan="7">Profile total = behaviour + effort + participation + punctuality (maximum 16); it is reported separately from the overall grade.</td></tr></tbody></table></section>`;}
function rptAppendixStart(){return `<div class="rpt-appendix">${partHead('Appendix','Achievement Levels and Reporting Notes','The information below explains the grading scale and the learner profile descriptors used throughout this report.')}</div>`;}
function rptLevels(){return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle">Achievement Levels</div><table class="rpt-table"><colgroup><col style="width:17mm"><col style="width:31mm"><col></colgroup><thead><tr><th>Level</th><th>Descriptor</th><th style="text-align:left">Description</th></tr></thead><tbody>${SEED.achievementLevels.map(([grade,word,desc])=>`<tr><td class="lv">${grade}</td><td class="descriptor">${escapeHTML(word)}</td><td>${escapeHTML(desc)}</td></tr>`).join('')}</tbody></table></section>`;}
function rptProfileScale(){return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle">Learner Profile Descriptors</div><table class="rpt-table"><colgroup><col style="width:34mm"><col style="width:30mm"><col></colgroup><thead><tr><th>Rating</th><th>Indicator</th><th style="text-align:left">Meaning</th></tr></thead><tbody>${SEED.profileScale.map(([word,score,desc])=>`<tr><td class="descriptor">${escapeHTML(word)}</td><td style="text-align:center" class="dots">${DOTS[score]}</td><td>${escapeHTML(desc)}</td></tr>`).join('')}</tbody></table></section>`;}
function rptNotes(){const notes=["The Overall Grade Distribution indicates how many students in the cohort were awarded each overall grade for the reporting period. The format is 'number of students / cohort'. For example, 'A 3/20' indicates that three students out of a cohort of twenty received an overall grade of A; the denominator is calculated separately for each course.","Learning criteria are reported using the A to E achievement scale described above. The overall grade is determined from performance across all assessment tasks and learning criteria in the course.","The Learner Profile is reported separately from academic achievement and records the student's behaviour, effort, participation and punctuality throughout the reporting period.","Marks and grades in this report reflect achievement to the date of issue and are subject to moderation and external verification."];return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle" style="border-bottom:.35pt solid var(--border);padding-bottom:1mm">Notes on this report</div><ul class="rpt-notes">${notes.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></section>`;}
function rptCertification(st){const staff=[['Class Teacher',st.classTeacher||data.staff.classTeacher],['HSC Coordinator',data.staff.hscCoordinator],['Deputy Principal',data.staff.deputyPrincipal]];return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle" style="border-bottom:.35pt solid var(--border);padding-bottom:1mm">Report Certification</div><div class="certification">${staff.map(([role,name])=>`<div><div class="sig-line"></div><strong>${escapeHTML(name||'Name not set')}</strong><em>${escapeHTML(role)}</em></div>`).join('')}</div><div class="issue-line">Date of issue: ${escapeHTML(fmtDate(data.issueDate))}</div></section>`;}
function createSheet(pages,st,draft,cover=false){const sheet=document.createElement('section');sheet.className='sheet '+(cover?'sheet-cover':'sheet-standard')+(draft?' draft-sheet':'');sheet.setAttribute('aria-label',cover?'Cover page':'Report page');if(cover){sheet.innerHTML=reportCover(st,enrolled(st),draft);}else{sheet.innerHTML=`<img class="watermark-img" src="${SEED.assets.watermark}" alt="" aria-hidden="true"><div class="sheet-header"><span>${escapeHTML(data.schoolEn)}</span><span>Year 11 - Preliminary Student Report ${escapeHTML(data.academicYear)}</span></div><div class="sheet-body"></div><div class="sheet-footer"><span>${escapeHTML(label(st))} &nbsp; · &nbsp; Year 11 Preliminary Report &nbsp; · &nbsp; Academic Year ${escapeHTML(data.academicYear)}</span><span class="page-n"></span></div>${draft?'<div class="draft-mark">DRAFT</div>':''}`;}pages.appendChild(sheet);return sheet;}
function paginateStudent(st,draft){stage.innerHTML=`<div class="preview-bar"><div><strong>${escapeHTML(label(st))} · Academic Year ${escapeHTML(data.academicYear)}</strong><br><span>${draft?'Draft — incomplete data; do not distribute as final':'Final report preview'} · Save as PDF in your browser</span></div><div class="actions"><button class="btn btn-small btn-secondary" data-action="close-preview">← Back</button><button class="btn btn-small btn-gold" data-action="print-preview">Generate PDF / Print</button></div></div><div class="report-pages"></div>`;document.body.classList.add('preview-mode');const pages=stage.querySelector('.report-pages');const cover=createSheet(pages,st,draft,true);let current=null;const overflow=[];function fitCover(selector,minPt,boundarySelector){const boundary=cover.querySelector(boundarySelector);for(const el of cover.querySelectorAll(selector)){let pt=parseFloat(getComputedStyle(el).fontSize)*.75;const tooTall=()=>el.getBoundingClientRect().bottom>boundary.getBoundingClientRect().top-7;while(pt>minPt&&(el.scrollWidth>el.clientWidth+1||tooTall())){pt-=.5;el.style.fontSize=pt+'pt';}if(el.scrollWidth>el.clientWidth+1||tooTall())overflow.push('Cover text: '+el.textContent.trim().slice(0,30));}}fitCover('.cover-names .val',11,'.cover-details');fitCover('.cover-details .val',8,'.cover-courses');if(cover.querySelector('.cover-courses').getBoundingClientRect().bottom>cover.querySelector('.cover-note').getBoundingClientRect().top-12)overflow.push('Cover course list');function fresh(){current=createSheet(pages,st,draft,false).querySelector('.sheet-body');return current;}function add(html,kind='block'){const holder=document.createElement('div');holder.innerHTML=html;const node=holder.firstElementChild;if(!node)return;if(!current)fresh();current.appendChild(node);if(current.scrollHeight>current.clientHeight+3){current.removeChild(node);if(current.children.length>0)fresh();current.appendChild(node);if(current.scrollHeight>current.clientHeight+3)overflow.push(kind);}}const subs=enrolled(st);fresh();add(partHead('Part One','Academic Achievement','The following pages report, for each course, the learning criteria assessed during the Year 11 Preliminary course, the level of achievement attained against each criterion, the overall grade awarded and the student’s learner profile.'),'Part One heading');subs.forEach((s,i)=>add(rptAchievement(st,s,i),'Achievement: '+s.name));add(rptResultSummary(st,subs),'Summary of Results');add(rptProfileSummary(st,subs),'Profile Summary');fresh();add(partHead('Part Two','Teacher Comments','The comments that follow are provided by the teacher of each course and should be read alongside the achievement data presented in Part One. Comments describe each student’s strengths, areas for development and recommended next steps.'),'Part Two heading');subs.forEach((s,i)=>add(rptTeacherComment(st,s,i),'Comment: '+s.name));add(rptCourseSummary(st,subs),'Course-by-Course Summary');fresh();add(rptAppendixStart(),'Appendix heading');add(rptLevels(),'Achievement Levels');add(rptProfileScale(),'Learner Profile Descriptors');add(rptNotes(),'Notes');add(rptCertification(st),'Certification');const sheets=[...pages.querySelectorAll('.sheet')];sheets.forEach((sheet,i)=>{const f=sheet.querySelector('.page-n');if(f)f.textContent=`Page ${i+1} of ${sheets.length}`;});if(overflow.length){const badge=stage.querySelector('.preview-bar span');badge.textContent+=' · Layout alert: content exceeds a page ('+overflow.join(', ')+'). Shorten text or criteria before printing.';toast('Some report content is too long for a page. Review the preview before printing.','error');}window.scrollTo(0,0);return overflow;}
/* ---------- Forms, roster editing and browser-local transfer ---------- */
function allowLeave(){if(!ui.unsaved)return true;if(!confirm('There are unsaved changes on this screen. Discard them?'))return false;ui.unsaved=false;return true;}
function closeModal(){if(!allowLeave())return;modalRoot.innerHTML='';}
function openModal(markup){modalRoot.innerHTML=`<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Edit record">${markup}</div></div>`;modalRoot.querySelector('.modal-close')?.focus();ui.unsaved=false;}
function studentModal(id){const st=data.students.find(x=>x.id===id),selected=st?.subjectIds||[];openModal(`<button class="modal-close" type="button" data-action="close-modal" aria-label="Close dialog">×</button><p class="eyebrow">Student roster</p><h2>${st?'Edit student':'Add student'}</h2><p class="lead">Enter both Pinyin and English names. Select only the courses this student actually studies.</p><form id="student-form" data-id="${escapeHTML(st?.id||'')}"><div class="field-grid"><div class="field"><label for="student-pinyin">Student name (Pinyin)</label><input id="student-pinyin" name="pinyin" maxlength="100" required value="${escapeHTML(st?.pinyin||'')}" placeholder="e.g. WANG Yihan"></div><div class="field"><label for="student-english">English name</label><input id="student-english" name="english" maxlength="100" required value="${escapeHTML(st?.english||'')}" placeholder="e.g. Olivia"></div><div class="field full"><label for="student-teacher">Class Teacher (optional student-specific override)</label><input id="student-teacher" name="classTeacher" maxlength="100" value="${escapeHTML(st?.classTeacher||'')}" placeholder="Use the default teacher if left blank"></div></div><div class="divider"></div><h3>Subject enrolments</h3><p class="lead" style="margin-bottom:11px">Courses omitted here will not appear on this student's report or in their subject roster.</p><div class="actions" style="margin-bottom:12px"><button type="button" class="btn btn-small btn-secondary" data-action="check-enrolments" data-mode="all">Select all</button><button type="button" class="btn btn-small btn-secondary" data-action="check-enrolments" data-mode="none">Clear</button></div><div class="check-grid">${data.subjects.map(s=>`<label class="check-row"><input type="checkbox" name="subjects" value="${escapeHTML(s.id)}" ${selected.includes(s.id)?'checked':''}><span>${escapeHTML(s.name)} <small style="color:var(--muted)">· ${unitsText(s.units)}</small></span></label>`).join('')}</div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${st?'Save student':'Add student'}</button></div></form>`);}
function subjectModal(id){const sub=data.subjects.find(x=>x.id===id);openModal(`<button class="modal-close" type="button" data-action="close-modal" aria-label="Close dialog">×</button><p class="eyebrow">Course setup</p><h2>${sub?'Edit subject':'Add subject'}</h2><p class="lead">Subject order can be changed with the arrow controls in the subjects list.</p><form id="subject-form" data-id="${escapeHTML(sub?.id||'')}"><div class="field-grid"><div class="field full"><label for="subject-name">Course name</label><input id="subject-name" name="name" maxlength="150" required value="${escapeHTML(sub?.name||'')}" placeholder="e.g. Mathematics Advanced"></div><div class="field"><label for="subject-code">Short code</label><input id="subject-code" name="code" maxlength="18" required value="${escapeHTML(sub?.code||'')}" placeholder="e.g. MAD"></div><div class="field"><label for="subject-units">Preliminary units</label><input id="subject-units" name="units" type="number" min="0.5" max="10" step="0.5" required value="${escapeHTML(sub?.units||2)}"></div><div class="field full"><label for="subject-teachers">Subject teacher(s)</label><input id="subject-teachers" name="teachers" maxlength="150" value="${escapeHTML(sub?.teachers||'')}" placeholder="Enter subject teacher name(s)"></div><div class="field full"><label for="subject-criteria">Learning criteria — one per line</label><textarea id="subject-criteria" name="criteria" rows="11" maxlength="15000" placeholder="One learning criterion per line…">${escapeHTML(sub?.criteria.join('\n')||'')}</textarea><small>Editing or reordering criteria preserves grades for unchanged criterion text and clears grades for changed criteria.</small></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${sub?'Save subject':'Add subject'}</button></div></form>`);}
function saveSettings(form){if(!form.reportValidity())return;const fd=new FormData(form);const nextYear=String(fd.get('academicYear')||'').trim();if(nextYear!==data.academicYear&&data.students.length&&!confirm('Changing the academic year will relabel the existing student records and grades. For a new cohort, export a backup and Reset local data instead. Continue with this year change?'))return;data.schoolEn=String(fd.get('schoolEn')||'').trim();data.schoolCn=String(fd.get('schoolCn')||'').trim();data.academicYear=String(fd.get('academicYear')||'').trim();data.period=String(fd.get('period')||'').trim();data.issueDate=String(fd.get('issueDate')||'');for(const [key,field] of [['classTeacher','classTeacher'],['hscCoordinator','hscCoordinator'],['deputyPrincipal','deputyPrincipal']])data.staff[key]=String(fd.get(field)||'').trim();ui.unsaved=false;persist();render();toast('School and staff settings saved.');}
function saveStudent(form){if(!form.reportValidity())return;const fd=new FormData(form),id=form.dataset.id,old=data.students.find(x=>x.id===id),pinyin=String(fd.get('pinyin')||'').trim(),english=String(fd.get('english')||'').trim(),classTeacher=String(fd.get('classTeacher')||'').trim();if(!pinyin||!english){toast('Both names are required.','error');return;}const subjectIds=[...form.querySelectorAll('input[name="subjects"]:checked')].map(x=>x.value),removed=old?(old.subjectIds||[]).filter(x=>!subjectIds.includes(x)):[];if(removed.length&&removed.some(x=>data.reports[id]?.[x])&&!confirm('You removed a subject with an existing teacher entry. Save and permanently discard those entries for this student?'))return;const dupe=data.students.find(x=>x.id!==id&&x.pinyin.toLocaleLowerCase()===pinyin.toLocaleLowerCase()&&x.english.toLocaleLowerCase()===english.toLocaleLowerCase());if(dupe){toast('A student with the same Pinyin and English names already exists.','error');return;}if(old){Object.assign(old,{pinyin,english,classTeacher,subjectIds});for(const sid of removed)delete data.reports[id]?.[sid];}else data.students.push({id:makeId('st'),pinyin,english,classTeacher,subjectIds});ui.unsaved=false;modalRoot.innerHTML='';persist();render();toast(old?'Student updated.':'Student added.');}
function saveSubject(form){if(!form.reportValidity())return;const fd=new FormData(form),id=form.dataset.id,old=data.subjects.find(x=>x.id===id);const name=String(fd.get('name')||'').trim(),code=String(fd.get('code')||'').trim(),teachers=String(fd.get('teachers')||'').trim(),units=Number(fd.get('units'));const criteria=String(fd.get('criteria')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!name||!code||!(units>=0.5&&units<=10)){toast('Enter a name, code and valid unit load.','error');return;}if(criteria.length>35||criteria.some(x=>x.length>650)){toast('Use at most 35 criteria of no more than 650 characters each.','error');return;}if(new Set(criteria.map(x=>x.toLocaleLowerCase())).size!==criteria.length){toast('Remove duplicate learning criteria.','error');return;}if(data.subjects.some(s=>s.id!==id&&s.code.toLocaleLowerCase()===code.toLocaleLowerCase())){toast('A subject with that code already exists.','error');return;}if(old){if((name!==old.name||code!==old.code)&&roster(old.id).some(st=>data.reports[st.id]?.[old.id])&&!confirm('Changing the subject name or code may make teacher JSON packages incompatible. Send teachers a new starter after saving. Continue?'))return;if(JSON.stringify(criteria)!==JSON.stringify(old.criteria)){const count=roster(old.id).filter(st=>data.reports[st.id]?.[old.id]).length;if(count&&!confirm(`These criteria have changed. For ${count} saved subject entries, only grades for exactly unchanged criterion text will be retained; edited criteria will need to be regraded. Continue?`))return;for(const st of data.students){const r=data.reports[st.id]?.[old.id];if(r){const previous=new Map(old.criteria.map((c,i)=>[c,r.criteriaGrades[i]||'']));r.criteriaGrades=criteria.map(c=>previous.get(c)||'');}}}Object.assign(old,{name,code,units,teachers,criteria});}else data.subjects.push({id:makeId('sub'),name,code,units,teachers,criteria});ui.unsaved=false;modalRoot.innerHTML='';persist();render();toast(old?'Subject updated.':'Subject added.');}
function saveEntry(form,event){const sub=data.subjects.find(x=>x.id===form.dataset.subject),st=data.students.find(x=>x.id===form.dataset.student);if(!sub||!st||!st.subjectIds.includes(sub.id)){toast('This student is not enrolled in that subject.','error');return;}const fd=new FormData(form);const record={criteriaGrades:sub.criteria.map((_,i)=>String(fd.get('crit_'+i)||'')),overallGrade:String(fd.get('overallGrade')||''),profile:PROFILE_LABELS.map((_,i)=>String(fd.get('profile_'+i)||'')),comment:String(fd.get('comment')||'').trim(),updatedAt:new Date().toISOString()};if(!data.reports[st.id])data.reports[st.id]={};data.reports[st.id][sub.id]=record;ui.unsaved=false;persist();const students=roster(sub.id),pos=students.findIndex(x=>x.id===st.id),next=event.submitter?.value==='next'?students[pos+1]:null;if(next)ui.editStudentId=next.id;render();toast(completeReport(st,sub)?`Saved ${st.english}'s complete report.`:`Saved ${st.english}'s draft entry.`);}
function saveSummary(form){const st=data.students.find(x=>x.id===form.dataset.id);if(!st)return;const fd=new FormData(form);data.summaries[st.id]={overview:String(fd.get('overview')||'').trim(),strengths:String(fd.get('strengths')||'').trim(),development:String(fd.get('development')||'').trim()};ui.unsaved=false;persist();render();toast(`Summary saved for ${st.english}.`);}
function filenamePart(value){return String(value).normalize('NFKD').replace(/[^A-Za-z0-9-]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'course';}
function downloadJSON(object,name){const blob=new Blob([JSON.stringify(object,null,2)+'\n'],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('JSON file downloaded. Store and share it through an approved private channel.');}
function exportBackup(){downloadJSON({format:'report-studio-backup-v1',version:1,exportedAt:new Date().toISOString(),data},`Private-FULL-BACKUP-${filenamePart(data.academicYear)}.json`);}
function exportStarter(subId){const s=data.subjects.find(x=>x.id===subId);if(!s)return;downloadJSON({format:'report-studio-starter-v1',version:1,schoolEn:data.schoolEn,schoolCn:data.schoolCn,academicYear:data.academicYear,period:data.period,subject:JSON.parse(JSON.stringify(s)),roster:roster(s.id).map(st=>({id:st.id,pinyin:st.pinyin,english:st.english}))},`Teacher-STARTER-${filenamePart(s.code)}-${filenamePart(data.academicYear)}.json`);}
function exportSubject(subId){const s=data.subjects.find(x=>x.id===subId);if(!s)return;const members=roster(s.id);downloadJSON({format:'report-studio-subject-v1',version:1,schoolEn:data.schoolEn,academicYear:data.academicYear,subject:{id:s.id,code:s.code,name:s.name,criteria:s.criteria},roster:members.map(st=>({id:st.id,pinyin:st.pinyin,english:st.english})),entries:members.filter(st=>data.reports[st.id]?.[s.id]).map(st=>({studentId:st.id,report:data.reports[st.id][s.id]})),exportedAt:new Date().toISOString()},`Subject-ENTRIES-${filenamePart(s.code)}-${filenamePart(data.academicYear)}.json`);}
function cleanText(v,max=150){if(v==null)return '';if(typeof v!=='string'||v.length>max)throw Error('A text field has an invalid type or is too long.');return v.trim();}
function cleanId(v,prefix){if(typeof v!=='string'||!new RegExp('^'+prefix+'_[A-Za-z0-9_-]{1,95}$').test(v))throw Error('Invalid student or subject ID in JSON.');return v;}
function cleanSubject(x){if(!x||typeof x!=='object')throw Error('Invalid subject record.');const id=cleanId(x.id,'sub'),name=cleanText(x.name,150),code=cleanText(x.code,18),teachers=cleanText(x.teachers,150),units=Number(x.units);if(!name||!code||!(units>=.5&&units<=10)||!Array.isArray(x.criteria)||x.criteria.length>35)throw Error('Invalid subject name, units or criteria.');const criteria=x.criteria.map(y=>cleanText(y,650));if(criteria.some(c=>!c)||new Set(criteria.map(c=>c.toLowerCase())).size!==criteria.length)throw Error('A subject has duplicate or empty criteria.');return {id,name,code,units,teachers,criteria};}
function cleanStudent(x,subIds){if(!x||typeof x!=='object')throw Error('Invalid student record.');const id=cleanId(x.id,'st'),pinyin=cleanText(x.pinyin,100),english=cleanText(x.english,100),classTeacher=cleanText(x.classTeacher,100);if(!pinyin||!english||!Array.isArray(x.subjectIds))throw Error('A student is missing names or enrolments.');const subjectIds=x.subjectIds.map(y=>cleanId(y,'sub'));if(subjectIds.some(id=>!subIds.has(id))||new Set(subjectIds).size!==subjectIds.length)throw Error('A student is enrolled in a missing or duplicate subject.');return {id,pinyin,english,classTeacher,subjectIds};}
function cleanReport(x,sub){if(!x||typeof x!=='object'||!Array.isArray(x.criteriaGrades)||x.criteriaGrades.length>sub.criteria.length||!Array.isArray(x.profile)||x.profile.length>4)throw Error('An imported report has an invalid grade or profile array.');const criteriaGrades=x.criteriaGrades.map(g=>cleanText(g,1)),overallGrade=cleanText(x.overallGrade,1),profile=x.profile.map(p=>cleanText(p,20)),comment=cleanText(x.comment,3000);if(criteriaGrades.some(g=>g&&!GRADES.includes(g))||(overallGrade&&!GRADES.includes(overallGrade))||profile.some(p=>p&&!RATING[p]))throw Error('An imported report contains grades or ratings outside the defined scales.');return {criteriaGrades,overallGrade,profile,comment,updatedAt:cleanText(x.updatedAt,40)};}
function validateState(x){if(!x||x.version!==1||!Array.isArray(x.students)||!Array.isArray(x.subjects)||!x.reports||typeof x.reports!=='object'||x.students.length>2000||x.subjects.length>100)throw Error('This is not a compatible report-studio backup.');const subjects=x.subjects.map(cleanSubject),subIds=new Set(subjects.map(s=>s.id));if(subIds.size!==subjects.length)throw Error('Duplicate subject IDs in JSON.');const students=x.students.map(st=>cleanStudent(st,subIds)),stIds=new Set(students.map(st=>st.id));if(stIds.size!==students.length)throw Error('Duplicate student IDs in JSON.');const reports={};for(const st of students){if(!x.reports[st.id])continue;const source=x.reports[st.id];if(typeof source!=='object'||Array.isArray(source))throw Error('Invalid subject entries for student.');for(const sid of st.subjectIds){if(source[sid]){if(!reports[st.id])reports[st.id]={};reports[st.id][sid]=cleanReport(source[sid],subjects.find(s=>s.id===sid));}}}const summaries={};for(const st of students){const sum=x.summaries?.[st.id];if(sum){summaries[st.id]={overview:cleanText(sum.overview,1200),strengths:cleanText(sum.strengths,1200),development:cleanText(sum.development,1200)};}}const staff=x.staff||{};return {version:1,schoolEn:cleanText(x.schoolEn,150),schoolCn:cleanText(x.schoolCn,150),academicYear:cleanText(x.academicYear,6),period:cleanText(x.period,150),issueDate:cleanText(x.issueDate,15),staff:{classTeacher:cleanText(staff.classTeacher,100),hscCoordinator:cleanText(staff.hscCoordinator,100),deputyPrincipal:cleanText(staff.deputyPrincipal,100)},subjects,students,reports,summaries};}
function importBackup(packageData){const next=validateState(packageData.data);if(!confirm(`REPLACE all data currently stored in this browser with this backup for ${next.academicYear}? Export a full backup of the current workspace first if you need it.`))return;data=next;ui.view='overview';ui.subjectId=null;ui.editStudentId=null;ui.reportStudentId=null;ui.unsaved=false;persist();render();toast(`Imported full backup: ${data.students.length} students, ${data.subjects.length} subjects.`);}
function cleanRoster(rows){if(!Array.isArray(rows)||rows.length>2000)throw Error('Invalid subject roster.');const seen=new Set();return rows.map(x=>{const id=cleanId(x.id,'st'),pinyin=cleanText(x.pinyin,100),english=cleanText(x.english,100);if(!pinyin||!english||seen.has(id))throw Error('Duplicate or incomplete student in subject roster.');seen.add(id);return {id,pinyin,english};});}
function assertRosterMatches(rows,sub){const local=roster(sub.id);if(local.length!==rows.length)throw Error('Roster does not match the admin workspace. Send the teacher an updated starter.');const byId=new Map(local.map(st=>[st.id,st]));for(const row of rows){const st=byId.get(row.id);if(!st||st.pinyin!==row.pinyin||st.english!==row.english)throw Error('Student IDs or names differ from the admin workspace. Send an updated starter.');}}
function importStarter(pkg){const sub=cleanSubject(pkg.subject),rows=cleanRoster(pkg.roster),year=cleanText(pkg.academicYear,6),schoolEn=cleanText(pkg.schoolEn,150),schoolCn=cleanText(pkg.schoolCn,150),period=cleanText(pkg.period,150);if(!/^20\d\d$/.test(year)||!schoolEn)throw Error('Teacher starter is missing a valid year or school name.');const isFresh=data.students.length===0&&Object.keys(data.reports).length===0;if(!isFresh&&(data.academicYear!==year||data.schoolEn!==schoolEn))throw Error('This starter belongs to a different school or reporting year. Export your existing work and reset this browser before starting a new year.');const existing=data.subjects.find(s=>s.id===sub.id);if(!isFresh&&existing&&(existing.name!==sub.name||existing.code!==sub.code||JSON.stringify(existing.criteria)!==JSON.stringify(sub.criteria)))throw Error('Course criteria differ from the current workspace. Export your current subject entries and start fresh before importing this updated starter.');if(!isFresh){for(const row of rows){const old=data.students.find(st=>st.id===row.id);if(old&&(old.pinyin!==row.pinyin||old.english!==row.english))throw Error('A student name differs from this starter. Resolve the roster on the admin device first.');}}const incomingIds=new Set(rows.map(x=>x.id)),removed=existing?roster(sub.id).filter(st=>!incomingIds.has(st.id)):[];const message=isFresh?'The seven blank example course templates on this browser will be replaced by this one subject.':existing?`Existing entries for enrolled students are kept. ${removed.length} student(s) no longer enrolled in this subject will be removed from its roster and their subject entries deleted.`:'This subject and its roster will be added; other courses and entries remain unchanged.';if(!confirm(`Import the ${sub.name} teacher starter for ${rows.length} students? ${message}`))return;if(isFresh){data=initialState();data.subjects=[];data.students=[];}data.schoolEn=schoolEn;data.schoolCn=schoolCn;data.academicYear=year;data.period=period;if(!data.subjects.some(s=>s.id===sub.id))data.subjects.push(sub);if(removed.length){for(const st of removed){st.subjectIds=st.subjectIds.filter(sid=>sid!==sub.id);delete data.reports[st.id]?.[sub.id];if(!st.subjectIds.length){data.students=data.students.filter(x=>x.id!==st.id);delete data.reports[st.id];delete data.summaries[st.id];}}}for(const row of rows){let st=data.students.find(x=>x.id===row.id);if(!st){st={...row,classTeacher:'',subjectIds:[]};data.students.push(st);}if(!st.subjectIds.includes(sub.id))st.subjectIds.push(sub.id);}ui.unsaved=false;ui.view='subjects';ui.subjectId=sub.id;ui.editStudentId=null;persist();render();toast(`Imported ${sub.name} starter for ${rows.length} students.`);}
function importSubject(pkg){const id=cleanId(pkg.subject?.id,'sub'),sub=data.subjects.find(s=>s.id===id);if(!sub)throw Error('Subject ID is not in this workspace. Restore the admin master backup first.');if(cleanText(pkg.schoolEn,150)!==data.schoolEn||cleanText(pkg.academicYear,6)!==data.academicYear)throw Error('Subject package belongs to another school or academic year.');if(cleanText(pkg.subject.name,150)!==sub.name||cleanText(pkg.subject.code,18)!==sub.code||JSON.stringify(pkg.subject.criteria)!==JSON.stringify(sub.criteria))throw Error('Course name, code or criteria differ from the admin master. Update the teacher starter before importing.');const rows=cleanRoster(pkg.roster);assertRosterMatches(rows,sub);if(!Array.isArray(pkg.entries)||pkg.entries.length>rows.length)throw Error('Invalid subject entries array.');const incoming=[],seen=new Set(),rosterIds=new Set(rows.map(x=>x.id));for(const item of pkg.entries){const stId=cleanId(item.studentId,'st');if(!rosterIds.has(stId)||seen.has(stId))throw Error('Duplicate or unmatched student in subject entries.');seen.add(stId);incoming.push([stId,cleanReport(item.report,sub)]);}if(!incoming.length){toast('This subject package contains no saved entries.','error');return;}const existing=incoming.filter(([id])=>data.reports[id]?.[sub.id]).length;if(!confirm(`Import ${incoming.length} ${sub.name} entries? ${existing} existing entry${existing===1?'':'ies'} will be replaced for this subject only. Other subjects remain unchanged.`))return;for(const [id,report] of incoming){if(!data.reports[id])data.reports[id]={};data.reports[id][sub.id]=report;}ui.unsaved=false;persist();render();toast(`Merged ${incoming.length} subject entries. ${cohort(sub.id).graded}/${cohort(sub.id).total} overall grades now entered.`);}
async function readImport(input){const file=input.files?.[0];if(!file)return;try{if(file.size>30*1024*1024)throw Error('JSON file is too large (30 MB limit).');const pkg=JSON.parse(await file.text());if(!pkg||pkg.version!==1)throw Error('Unsupported JSON version.');if(pkg.format==='report-studio-backup-v1')importBackup(pkg);else if(pkg.format==='report-studio-starter-v1')importStarter(pkg);else if(pkg.format==='report-studio-subject-v1')importSubject(pkg);else throw Error('This is not a recognised report-studio JSON file.');}catch(err){console.error('Import failed:',err);alert('Import not completed: '+err.message);toast('Import failed. Existing data was not changed.','error');}finally{input.value='';}}
function openReport(id,autoPrint=false){if(!allowLeave())return;const st=data.students.find(x=>x.id===id);if(!st){toast('Select a student first.','error');return;}const issues=issueList(st);if(autoPrint&&issues.length&&!confirm(`This report has ${issues.length} outstanding checklist item${issues.length===1?'':'s'} and will print with a DRAFT mark. Continue?`))return;const overflow=paginateStudent(st,issues.length>0);if(autoPrint){if(overflow.length){alert('Printing is paused because content does not fit on an A4 page. Please shorten the indicated text or criteria before printing.');return;}requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));}}
/* Delegated events keep the app entirely inside this one file. */
document.addEventListener('submit',e=>{const form=e.target;if(!['settings-form','student-form','subject-form','teacher-report-form','summary-form'].includes(form.id))return;e.preventDefault();if(form.id==='settings-form')saveSettings(form);else if(form.id==='student-form')saveStudent(form);else if(form.id==='subject-form')saveSubject(form);else if(form.id==='teacher-report-form')saveEntry(form,e);else saveSummary(form);});
document.addEventListener('change',e=>{if(e.target.id==='json-import'){readImport(e.target);return;}if(e.target.id==='report-student'){if(!allowLeave())return;ui.reportStudentId=e.target.value;render();}});
document.addEventListener('input',e=>{const form=e.target.closest('form');if(form&&['settings-form','student-form','subject-form','teacher-report-form','summary-form'].includes(form.id)){ui.unsaved=true;const status=document.getElementById('editor-status');if(status){status.textContent='Unsaved changes — click Save entry before leaving.';status.classList.add('dirty');}}});
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-action]');if(!trigger)return;const action=trigger.dataset.action,id=trigger.dataset.id;if(action==='modal-backdrop'){if(e.target===trigger)closeModal();return;}if(action==='view'){if(!allowLeave())return;ui.view=trigger.dataset.view;ui.subjectId=null;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='admin-tab'){if(!allowLeave())return;ui.view='admin';ui.adminTab=trigger.dataset.tab;ui.subjectId=null;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='student-modal'){if(!allowLeave())return;studentModal(id);}else if(action==='subject-modal'){if(!allowLeave())return;subjectModal(id);}else if(action==='close-modal')closeModal();else if(action==='check-enrolments'){for(const box of modalRoot.querySelectorAll('input[name="subjects"]'))box.checked=trigger.dataset.mode==='all';ui.unsaved=true;}else if(action==='delete-student'){const st=data.students.find(x=>x.id===id);if(st&&confirm(`Remove ${label(st)} and permanently delete all their report entries from this browser?`)){data.students=data.students.filter(x=>x.id!==id);delete data.reports[id];delete data.summaries[id];persist();render();toast('Student and associated report entries removed.');}}else if(action==='delete-subject'){const sub=data.subjects.find(x=>x.id===id);if(sub&&confirm(`Remove ${sub.name} from every student and delete all entries for this subject?`)){data.subjects=data.subjects.filter(s=>s.id!==id);for(const st of data.students){st.subjectIds=st.subjectIds.filter(sid=>sid!==id);delete data.reports[st.id]?.[id];}persist();render();toast('Subject and its entries removed.');}}else if(action==='move-subject'){const ix=data.subjects.findIndex(s=>s.id===id),target=ix+Number(trigger.dataset.dir);if(ix>=0&&target>=0&&target<data.subjects.length){[data.subjects[ix],data.subjects[target]]=[data.subjects[target],data.subjects[ix]];persist();render();}}else if(action==='open-subject'){ui.subjectId=id;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='back-subjects'){if(!allowLeave())return;ui.editStudentId=null;ui.subjectId=null;ui.view='subjects';render();}else if(action==='back-roster'){if(!allowLeave())return;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='edit-entry'){ui.editStudentId=id;render();window.scrollTo(0,0);}else if(action==='export-all')exportBackup();else if(action==='export-starter')exportStarter(id);else if(action==='export-subject')exportSubject(id);else if(action==='import-json')document.getElementById('json-import')?.click();else if(action==='reset-all'){if(prompt('This deletes all local student records, grades and comments on this browser. Export a backup first. Type RESET to confirm:')==='RESET'){localStorage.removeItem(STORE_KEY);data=initialState();ui.view='overview';ui.subjectId=null;ui.editStudentId=null;ui.unsaved=false;persist();render();toast('Local records reset. The blank 2027 template is ready.');}}else if(action==='preview'||action==='generate-pdf')openReport(id,action==='generate-pdf');else if(action==='close-preview'){document.body.classList.remove('preview-mode');stage.innerHTML='';render();window.scrollTo(0,0);}else if(action==='print-preview'){const alertText=stage.querySelector('.preview-bar span')?.textContent||'';if(alertText.includes('Layout alert')){alert('Some content exceeds an A4 page. Please shorten the indicated content before printing.');return;}if(alertText.includes('Draft —')&&!confirm('This report is marked DRAFT because some data is incomplete. Print the draft anyway?'))return;window.print();}});
window.addEventListener('beforeunload',e=>{if(ui.unsaved){e.preventDefault();e.returnValue='';}});
render();
})();
